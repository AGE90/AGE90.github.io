    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>

<body>
    <!-- Header Section -->
    <div id="header-section"></div>
    <!-- About Me Section -->
    <div id="about-section"></div>
    <!-- Projects Section -->
    <div id="projects-section"></div>
    <!-- Blogs Section -->
    <div id="blogs-section"></div>
    <!-- Contact Section -->
    <div id="contact-section"></div>
    <div class="text-center">
        <a href="https://codepen.io/nightcl4w/pen/dEjreJ" style="color: #34312f;" target="_blank">Template by OrderMerch</a>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>

    <script>
    function loadHTML(id, file) {
      fetch(file)
        .then(response => response.text())
        .then(data => document.getElementById(id).innerHTML = data);
    }
    loadHTML('header-section', 'sections/header.html');
    loadHTML('about-section', 'sections/about.html');
    loadHTML('projects-section', 'sections/projects.html');
    loadHTML('blogs-section', 'sections/blogs.html');
    loadHTML('contact-section', 'sections/contact.html');
    </script>
</body>

</html>
